<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammed Razi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#fff;--mut:rgba(255,255,255,.62);--ln:rgba(255,255,255,.16);--ac:#8ea2ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:#fff;font-family:Poppins,system-ui,-apple-system,sans-serif;background:#04020c;overflow-x:hidden}
.arcs{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(60% 45% at 78% 0%,rgba(170,60,230,.7),transparent 62%),radial-gradient(55% 40% at 0% 100%,rgba(70,40,200,.45),transparent 65%)}
.arc{position:absolute;display:block;border-radius:50%}
.arc.p{width:140vmax;height:140vmax;left:-70vmax;top:-132vmax;background:radial-gradient(circle at 50% 100%,#14041f,#04010a 62%);box-shadow:0 2px 0 rgba(245,160,255,.85),0 18px 90px rgba(190,70,255,.65)}
.arc.b{width:150vmax;height:150vmax;left:18%;top:72%;background:radial-gradient(circle at 50% 0%,#2c55d8,#0b1d6b 38%,#040a2c 70%);box-shadow:0 -2px 0 rgba(190,210,255,.8),0 -24px 90px rgba(60,100,255,.65)}
.stage{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));perspective:1100px}
.glass{width:100%;max-width:440px;padding:24px 20px 20px;border-radius:34px;border:1px solid rgba(255,255,255,.24);background:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 42%,rgba(255,255,255,.08));-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);box-shadow:0 34px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.08);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.dots{display:flex;gap:9px;margin:0 0 20px 4px}.dots i{width:13px;height:13px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.brand{font-weight:700;font-size:clamp(24px,7vw,30px);letter-spacing:.14em;padding:0 4px 18px;background:linear-gradient(90deg,#4d7dff,#9a62ff 60%,#c46cff);-webkit-background-clip:text;background-clip:text;color:transparent;border-bottom:1px solid var(--ln)}
.who{display:flex;align-items:center;gap:16px;padding:18px 4px;border-bottom:1px solid var(--ln)}
.av-img{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.55);box-shadow:0 8px 24px rgba(90,80,255,.5)}
.nm{font-weight:600;font-size:18px;line-height:1.3}.sb{color:var(--mut);font-size:13.5px;line-height:1.45}
.label{color:var(--mut);font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:18px 6px 8px}
a.link{display:flex;align-items:center;gap:18px;padding:13px 14px;margin:3px 0;border-radius:16px;border:1px solid transparent;color:#fff;text-decoration:none;font-size:17px;font-weight:500;transition:background .2s,border-color .2s,box-shadow .2s}
a.link:hover,a.link:focus-visible{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border-color:rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.25);outline:0}
a.link .ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a.link .t{flex:1}a.link .sp{display:none}
.sep{height:1px;background:var(--ln);margin:10px 0}
.dash{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:22px;font-weight:600}h2{font-size:15px;font-weight:600;margin:22px 0 6px}
.photo{display:flex;align-items:center;gap:16px;margin:18px 0 6px;padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--ln)}
.photo .btnrow{display:flex;gap:8px;margin:8px 0 6px;flex-wrap:wrap}
input,button{font:inherit;font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
input::placeholder{color:var(--mut)}
button{cursor:pointer;transition:background .2s}button:hover{background:rgba(255,255,255,.2)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.5}
#go,#pick{background:linear-gradient(90deg,#4d7dff,#9a62ff);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.card{background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:16px;padding:14px}
.card b{display:block;font-size:1.6rem}.card span{color:var(--mut);font-size:.8rem}
.row{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:.85rem}
.row .n{width:80px}.row .bar{flex:1;background:rgba(255,255,255,.1);border-radius:6px;height:10px}
.row .bar i{display:block;height:100%;background:linear-gradient(90deg,#4d7dff,#c46cff);border-radius:6px}
.row .v{width:32px;text-align:right}
.days{display:flex;align-items:flex-end;gap:6px;min-height:100px;margin-top:10px}
.days div{flex:1;text-align:center;font-size:.62rem;color:var(--mut)}
.days i{display:block;background:#8ea2ff;border-radius:4px 4px 0 0;min-height:2px}
.pair{display:flex;align-items:flex-end;gap:2px;height:84px}.pair i{flex:1}.pair i.c{background:#e0a8ff}
table{width:100%;border-collapse:collapse;font-size:.75rem}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600}
.note,small{font-size:.78rem;color:var(--mut)}.note{margin-top:16px}
.back{display:inline-block;margin-top:12px;color:#fff}
@media (prefers-reduced-motion:reduce){.glass{transition:none}}
</style>
</head>
<body>
<div class="arcs" aria-hidden="true"><i class="arc p"></i><i class="arc b"></i></div>
<div class="stage"><main class="glass" id="card">
<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="brand">MOHAMMED RAZI</div>

<div id="pub">
  <div class="who">
    <img class="av-img" alt="Mohammed Razi" width="68" height="68">
    <div><div class="sb">Maker 🖥️ | Traveler 🌍 | Dreamer 🌌</div></div>
  </div>
  <div class="label">Links</div>
  <div id="links"></div>
  <div class="sep"></div>
  <a class="link" href="#dashboard"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v3M12 9v9M17 5v13"/></svg><span class="t">Analytics</span></a>
</div>

<div id="dash" class="dash">
  <div class="top"><h1>Analytics</h1><button id="refresh" style="display:none">↻ Refresh</button></div>
  <div id="gate">
    <p>Enter your dashboard key</p>
    <input id="key" type="password" placeholder="Secret key"> <button id="go">Open</button>
  </div>
  <div id="stats" style="display:none">
    <div class="photo">
      <img class="av-img" alt="Your profile photo" width="68" height="68">
      <div><b>Profile photo</b>
        <div class="btnrow"><button id="pick" type="button">Upload photo</button><button id="reset" type="button">Reset</button></div>
        <small id="pmsg">Changes show in this browser only.</small>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
    </div>
    <div class="grid" id="cards"></div>
    <h2>Clicks per link</h2><div id="perlink"></div>
    <h2>Last 7 days <small>(views / clicks)</small></h2><div class="days" id="days"></div>
    <h2>Recent visitors</h2><div style="overflow-x:auto"><table id="log"></table></div>
  </div>
  <div class="note" id="mode"></div>
  <a class="link back" href="#">← Back to page</a>
</div>
</main></div>
<script>
// ====== EDIT THESE ======
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzZmh2qW0d3-Z3_A7pfAQJFkH7XIcQjvVdlTfIGmKNH-whtQTmnFctHfCdtH_jOFNWE/exec";          // paste your Google Apps Script Web App URL here (see tracker.gs)
const DASH_KEY = "4237"; // must match SECRET in tracker.gs (also used for local mode)
const ICONS = {
  linkedin:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>',
  github:'<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
  instagram:'<rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>',
  youtube:'<path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/>',
  facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
  twitter:'<path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>'
};
const LINKS = [
  {id:"linkedin", name:"LinkedIn",  icon:"fa-linkedin",  url:"https://linkedin.com/in/mohammed-razi"},
  {id:"github",   name:"GitHub",    icon:"fa-github",    url:"https://github.com/Mohammedrazi"},
  {id:"instagram",name:"Instagram", icon:"fa-instagram", url:"https://instagram.com/mohammed_razi_me", app:"instagram://user?username=mohammed_razi_me"},
  {id:"youtube",  name:"YouTube",   icon:"fa-youtube",   url:"https://youtube.com/channel/PASTE_YOUR_CHANNEL_ID"},
  {id:"facebook", name:"Facebook",  icon:"fa-facebook",  url:"https://facebook.com/PASTE_YOUR_PROFILE"},
  {id:"twitter",  name:"Twitter",   icon:"fa-twitter",   url:"https://twitter.com/mohammed__razi", app:"twitter://user?screen_name=mohammed__razi"}
];
// ========================

const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const uid = store.get("uid") || (()=>{const u=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set("uid",u);return u})();
const today = () => new Date().toISOString().slice(0,10);

const esc = x => String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let geo = {};
const geoP = (async()=>{
  try{const c=sessionStorage.getItem("geo"); if(c){geo=JSON.parse(c);return}}catch(e){}
  for(const u of ["https://ipapi.co/json/","https://api.country.is/"]){
    try{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),3000);
      const j=await (await fetch(u,{signal:ctl.signal})).json(); clearTimeout(t);
      const code=j.country_code||j.country||""; let name=j.country_name||"";
      if(!name&&code){try{name=new Intl.DisplayNames(["en"],{type:"region"}).of(code)}catch(e){name=code}}
      geo={ip:j.ip||"",country:name||code};
      try{sessionStorage.setItem("geo",JSON.stringify(geo))}catch(e){}
      return;
    }catch(e){}
  }
})();
function getDevice(){
  const u=navigator.userAgent;
  const os=/iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android":/Windows/.test(u)?"Windows":/Mac OS X/.test(u)?"Mac":/Linux/.test(u)?"Linux":"Other";
  const br=/Edg\//.test(u)?"Edge":/OPR\//.test(u)?"Opera":/Chrome|CriOS/.test(u)?"Chrome":/Firefox|FxiOS/.test(u)?"Firefox":/Safari/.test(u)?"Safari":"Browser";
  const ty=/iPad|Tablet/.test(u)?"Tablet":/Mobi|iPhone|Android/.test(u)?"Mobile":"Desktop";
  return `${os} · ${br} (${ty})`;
}

function track(type, link){
  const ev = {type, link:link||"", uid, ref:document.referrer||"direct", ip:geo.ip||"", country:geo.country||"", device:getDevice()};
  if(ENDPOINT){
    try{fetch(ENDPOINT,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify(ev)})}catch(e){}
  } else {
    const log = store.get("local_events",[]);
    log.push({...ev,t:Date.now(),d:today()});
    store.set("local_events",log.slice(-5000));
  }
}

function renderPage(){
  $("#links").innerHTML = LINKS.map(l=>`<a class="link" href="${l.url}" data-id="${l.id}" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[l.id]}</svg><span class="t">${l.name}</span><span class="sp"></span></a>`).join("");
  $("#links").addEventListener("click",e=>{
    const a=e.target.closest("a.link"); if(!a) return;
    track("click",a.dataset.id);
    const l=LINKS.find(x=>x.id===a.dataset.id);
    // On phones, try opening the native app first; fall back to the web link
    if(l.app && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      e.preventDefault();
      const t=setTimeout(()=>{ if(!document.hidden) location.href=l.url; },900);
      document.addEventListener("visibilitychange",()=>clearTimeout(t),{once:true});
      location.href=l.app;
    }
  });
  geoP.then(()=>track("view"));
}

async function loadStats(key){
  if(ENDPOINT){
    const r = await fetch(ENDPOINT+"?key="+encodeURIComponent(key));
    return r.json();
  }
  if(key!==DASH_KEY) return {error:"unauthorized"};
  const ev = store.get("local_events",[]);
  const views = ev.filter(e=>e.type==="view"), clicks = ev.filter(e=>e.type==="click");
  const perLink = {}; clicks.forEach(c=>perLink[c.link]=(perLink[c.link]||0)+1);
  const daily = [];
  for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);
    daily.push({date:d,views:views.filter(v=>v.d===d).length,clicks:clicks.filter(c=>c.d===d).length});}
  return {views:views.length,uniques:new Set(views.map(v=>v.uid)).size,clicks:clicks.length,perLink,daily,local:true,recent:ev.slice(-50).reverse()};
}

function renderStats(s){
  const ctr = s.views ? Math.round(s.clicks/s.views*100) : 0;
  $("#cards").innerHTML = [["Total views",s.views],["Unique visitors",s.uniques],["Total clicks",s.clicks],["Click rate",ctr+"%"]]
    .map(([k,v])=>`<div class="card"><b>${v}</b><span>${k}</span></div>`).join("");
  const max = Math.max(1,...LINKS.map(l=>s.perLink[l.id]||0));
  $("#perlink").innerHTML = LINKS.map(l=>{const n=s.perLink[l.id]||0;
    return `<div class="row"><span class="n">${l.name}</span><span class="bar"><i style="width:${n/max*100}%"></i></span><span class="v">${n}</span></div>`}).join("");
  const dm = Math.max(1,...s.daily.map(d=>Math.max(d.views,d.clicks||0)));
  $("#days").innerHTML = s.daily.map(d=>`<div><span class="pair"><i style="height:${d.views/dm*80}px"></i><i class="c" style="height:${(d.clicks||0)/dm*80}px"></i></span>${d.views}/${d.clicks||0}<br>${d.date.slice(5)}</div>`).join("");
  $("#refresh").style.display="inline-block";
  const rows=(s.recent||[]).map(r=>`<tr><td>${esc(new Date(r.t).toLocaleString())}</td><td>${r.type==="click"?"Click · "+esc((LINKS.find(l=>l.id===r.link)||{name:r.link}).name):"View"}</td><td>${esc(r.ip||"—")}</td><td>${esc(r.country||"—")}</td><td>${esc(r.device||"—")}</td></tr>`).join("");
  $("#log").innerHTML=`<tr><th>Date &amp; time</th><th>Action</th><th>IP address</th><th>Country</th><th>Device</th></tr>`+(rows||`<tr><td colspan="5">No visits yet</td></tr>`);
  $("#mode").textContent = s.local
    ? "Local mode: only counts visits from THIS browser. Add your Apps Script URL to count everyone."
    : "Live data from your Google Sheet.";
  $("#gate").style.display="none"; $("#stats").style.display="block";
}

$("#go").onclick = async()=>{
  const k=$("#key").value;
  try{const s=await loadStats(k);
    if(s.error){alert("Wrong key");return}
    store.set("dkey",k); renderStats(s);
  }catch(e){alert("Could not load stats. Check ENDPOINT.")}
};
$("#refresh").onclick = ()=>$("#go").click();

let rendered=false;
function route(){
  const d = location.hash==="#dashboard";
  $("#pub").style.display = d?"none":"block";
  $("#dash").style.display = d?"block":"none";
  if(d){ const saved=store.get("dkey"); if(saved){$("#key").value=saved;$("#go").click()} }
  else if(!rendered){ rendered=true; renderPage(); }
}
window.addEventListener("hashchange",route);
route();
</script>

  };
  $("#reset").onclick=()=>{try{localStorage.removeItem("avatar")}catch(e){} set(DEF); msg("Back to the default photo.")};
  if(matchMedia("(pointer:fine)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches){
    const st=document.querySelector(".stage");
    st.addEventListener("mousemove",e=>{
      card.style.setProperty("--ry",((e.clientX/innerWidth-.5)*9)+"deg");
      card.style.setProperty("--rx",((.5-e.clientY/innerHeight)*9)+"deg");
    });
    st.addEventListener("mouseleave",()=>{card.style.setProperty("--rx","0deg");card.style.setProperty("--ry","0deg")});
  }
})();
</script>
</body>
</html>
